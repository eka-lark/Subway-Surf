<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Subway Surf</title>
  <style>
    /* ─── Base Reset & Mobile Prevention ─── */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #000;
      touch-action: none; /* Prevent pull-to-refresh, pinch zoom */
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      position: fixed; /* Prevent iOS bounce */
    }
    #app { position: relative; width: 100%; height: 100%; }
    #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    /* ─── UI Layer ─── */
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      /* Safe area for notched phones */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #ui-layer > .screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: auto;
      padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 10px) env(safe-area-inset-bottom, 10px) env(safe-area-inset-left, 10px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #ui-layer > .screen.hidden { display: none; pointer-events: none; }

    /* ─── Buttons (mobile-first, large touch targets) ─── */
    .btn {
      padding: clamp(12px, 2vh, 16px) clamp(28px, 6vw, 40px);
      font-size: clamp(14px, 2.5vw, 18px);
      font-weight: 700; border: none; border-radius: 12px;
      cursor: pointer; min-width: 48px; min-height: 48px;
      transition: transform 0.1s, box-shadow 0.1s;
      text-transform: uppercase; letter-spacing: 1px;
      -webkit-appearance: none; appearance: none;
    }
    .btn:active { transform: scale(0.93); }
    .btn-primary {
      background: linear-gradient(135deg, #ff6b35, #f7c948); color: #1a1a2e;
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.15); color: #fff;
      border: 2px solid rgba(255,255,255,0.3); backdrop-filter: blur(10px);
    }

    /* ─── Loading Screen ─── */
    #screen-loading {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    #screen-loading .title {
      font-size: clamp(32px, 8vw, 48px); font-weight: 900;
      background: linear-gradient(135deg, #ff6b35, #f7c948);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: clamp(20px, 5vh, 40px); text-transform: uppercase;
    }
    .loading-bar-container {
      width: clamp(200px, 60vw, 300px); height: 8px;
      background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;
    }
    .loading-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #ff6b35, #f7c948); border-radius: 4px; transition: width 0.3s;
    }
    .loading-text { margin-top: 12px; font-size: clamp(12px, 2vw, 14px); opacity: 0.6; }

    /* ─── Main Menu ─── */
    #screen-menu { background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
    #screen-menu .title {
      font-size: clamp(32px, 10vw, 56px); font-weight: 900;
      background: linear-gradient(135deg, #ff6b35, #f7c948);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 10px;
    }
    #screen-menu .subtitle { font-size: clamp(12px, 2.5vw, 16px); opacity: 0.6; margin-bottom: clamp(20px, 5vh, 40px); }
    #screen-menu .high-score { font-size: clamp(14px, 3vw, 18px); margin-bottom: clamp(15px, 4vh, 30px); opacity: 0.8; }
    #screen-menu .menu-buttons { display: flex; flex-direction: column; gap: clamp(8px, 1.5vh, 12px); width: clamp(200px, 60vw, 280px); }
    #screen-menu .menu-buttons .btn { width: 100%; }
    #screen-menu .currency-bar {
      position: absolute; top: max(12px, env(safe-area-inset-top, 12px)); right: max(16px, env(safe-area-inset-right, 16px));
      display: flex; gap: clamp(8px, 2vw, 16px); font-size: clamp(13px, 2.5vw, 16px); font-weight: 600;
    }
    #screen-menu .currency-bar span { display: flex; align-items: center; gap: 4px; }

    /* ─── Gameplay HUD ─── */
    #screen-hud { pointer-events: none; justify-content: flex-start; padding-top: max(8px, env(safe-area-inset-top, 8px)); }
    #screen-hud .hud-top {
      width: 100%; padding: clamp(8px, 1.5vh, 16px) clamp(12px, 3vw, 20px);
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    #screen-hud .hud-left { display: flex; flex-direction: column; gap: 2px; }
    #screen-hud .score-display {
      font-size: clamp(20px, 5vw, 28px); font-weight: 800;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    #screen-hud .multiplier-display { font-size: clamp(11px, 2vw, 14px); opacity: 0.8; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    #screen-hud .coin-display { font-size: clamp(13px, 2.5vw, 16px); text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    #screen-hud .hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .pause-btn {
      pointer-events: auto; background: rgba(0,0,0,0.4); border: none; color: #fff;
      width: clamp(44px, 8vw, 52px); height: clamp(44px, 8vw, 52px);
      border-radius: 50%; font-size: clamp(18px, 3.5vw, 22px); cursor: pointer;
      backdrop-filter: blur(5px);
    }
    .powerup-timer {
      background: rgba(0,0,0,0.4); padding: 4px clamp(8px, 2vw, 14px); border-radius: 20px;
      font-size: clamp(11px, 2vw, 13px); backdrop-filter: blur(5px); display: none;
    }
    .powerup-timer-bar { height: 3px; background: #f7c948; border-radius: 2px; margin-top: 3px; transition: width 0.1s linear; }
    #screen-hud .hud-bottom {
      position: absolute; bottom: max(16px, env(safe-area-inset-bottom, 16px));
      left: clamp(12px, 3vw, 20px); display: flex; gap: 8px;
    }
    .hoverboard-indicator {
      pointer-events: auto; background: rgba(0,0,0,0.4); padding: 6px clamp(10px, 2.5vw, 16px);
      border-radius: 20px; font-size: clamp(12px, 2.5vw, 14px); backdrop-filter: blur(5px); cursor: pointer;
    }

    /* ─── Pause Screen ─── */
    #screen-pause { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); }
    #screen-pause .pause-title { font-size: clamp(28px, 7vw, 36px); font-weight: 800; margin-bottom: clamp(20px, 5vh, 40px); }
    #screen-pause .pause-buttons { display: flex; flex-direction: column; gap: clamp(8px, 1.5vh, 12px); width: clamp(200px, 55vw, 260px); }
    #screen-pause .pause-buttons .btn { width: 100%; }

    /* ─── Game Over Screen ─── */
    #screen-gameover { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); }
    #screen-gameover .go-title {
      font-size: clamp(28px, 8vw, 42px); font-weight: 900; margin-bottom: clamp(15px, 3vh, 30px);
      background: linear-gradient(135deg, #ff6b35, #f7c948);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .go-stats {
      display: flex; flex-direction: column; gap: clamp(4px, 1vh, 8px);
      margin-bottom: clamp(15px, 3vh, 30px); font-size: clamp(14px, 3vw, 18px);
    }
    .go-stats .label { opacity: 0.6; }
    .go-stats .value { font-weight: 700; }
    .go-stats .new-best { color: #f7c948; }
    .go-buttons { display: flex; gap: clamp(10px, 3vw, 16px); margin-top: clamp(10px, 2vh, 20px); flex-wrap: wrap; justify-content: center; }
    .mission-progress { margin-top: clamp(15px, 3vh, 30px); width: clamp(250px, 80vw, 320px); }
    .mission-progress h3 { font-size: clamp(11px, 2vw, 14px); text-transform: uppercase; opacity: 0.6; margin-bottom: 8px; letter-spacing: 1px; }
    .mission-item { display: flex; justify-content: space-between; align-items: center; padding: clamp(4px, 1vh, 8px) 0; font-size: clamp(11px, 2.2vw, 14px); gap: 6px; }
    .mission-bar { width: clamp(50px, 15vw, 80px); height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
    .mission-bar-fill { height: 100%; background: linear-gradient(90deg, #ff6b35, #f7c948); border-radius: 3px; }

    /* ─── Revive Screen ─── */
    #screen-revive { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); }
    .revive-prompt { text-align: center; }
    .revive-title { font-size: clamp(22px, 5vw, 28px); font-weight: 800; margin-bottom: clamp(10px, 2vh, 16px); }
    .revive-cost { font-size: clamp(13px, 2.5vw, 16px); opacity: 0.7; margin-bottom: clamp(12px, 3vh, 24px); }
    .revive-buttons { display: flex; gap: clamp(10px, 3vw, 16px); justify-content: center; flex-wrap: wrap; }
    .revive-timer { font-size: clamp(36px, 8vw, 48px); font-weight: 800; margin-bottom: clamp(10px, 2vh, 20px); color: #f7c948; }

    /* ─── Countdown ─── */
    .countdown-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 100;
    }
    .countdown-text {
      font-size: clamp(60px, 20vw, 120px); font-weight: 900; color: #fff;
      text-shadow: 0 0 40px rgba(255, 107, 53, 0.8); opacity: 0;
    }

    /* ─── Shop Screen ─── */
    #screen-shop { background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); }
    .shop-header {
      width: 100%; padding: clamp(12px, 2vh, 20px) clamp(12px, 3vw, 20px);
      display: flex; justify-content: space-between; align-items: center;
    }
    .shop-title { font-size: clamp(22px, 5vw, 28px); font-weight: 800; }
    .shop-close {
      background: none; border: none; color: #fff; font-size: clamp(24px, 5vw, 28px);
      cursor: pointer; padding: 8px; min-width: 48px; min-height: 48px;
      display: flex; align-items: center; justify-content: center;
    }
    .shop-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(100px, 28vw, 140px), 1fr));
      gap: clamp(8px, 2vw, 16px); padding: clamp(10px, 2vw, 20px);
      width: 100%; max-width: 600px; overflow-y: auto; max-height: 55vh;
      -webkit-overflow-scrolling: touch;
    }
    .shop-item {
      background: rgba(255,255,255,0.08); border-radius: 12px; padding: clamp(10px, 2vw, 16px);
      text-align: center; cursor: pointer; transition: transform 0.15s, background 0.15s;
    }
    .shop-item:active { transform: scale(0.95); background: rgba(255,255,255,0.15); }
    .shop-item.owned { border: 2px solid #4caf50; }
    .shop-item.equipped { border: 2px solid #f7c948; }
    .shop-item-icon { font-size: clamp(28px, 7vw, 40px); margin-bottom: 6px; }
    .shop-item-name { font-size: clamp(12px, 2.5vw, 14px); font-weight: 600; margin-bottom: 3px; }
    .shop-item-cost { font-size: clamp(10px, 2vw, 12px); opacity: 0.7; }

    /* ─── Missions Screen ─── */
    #screen-missions { background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); }
    .missions-list { width: 100%; max-width: 400px; padding: clamp(10px, 2vw, 20px); overflow-y: auto; max-height: 70vh; -webkit-overflow-scrolling: touch; }
    .missions-title { font-size: clamp(22px, 5vw, 28px); font-weight: 800; margin-bottom: clamp(12px, 2vh, 20px); text-align: center; }
    .mission-card { background: rgba(255,255,255,0.08); border-radius: 12px; padding: clamp(10px, 2vw, 16px); margin-bottom: clamp(8px, 1.5vh, 12px); }
    .mission-card-desc { font-size: clamp(13px, 2.5vw, 15px); margin-bottom: 6px; }
    .mission-card-progress { display: flex; justify-content: space-between; align-items: center; font-size: clamp(11px, 2vw, 13px); opacity: 0.7; }
    .mission-card-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin: 0 8px; overflow: hidden; }
    .mission-card-bar-fill { height: 100%; background: linear-gradient(90deg, #ff6b35, #f7c948); border-radius: 3px; }
    .mission-card-reward { font-size: clamp(10px, 2vw, 12px); color: #f7c948; margin-top: 4px; }
    .mission-card.completed { border: 2px solid #4caf50; opacity: 0.7; }

    /* ─── Landscape warning for very short screens ─── */
    @media (max-height: 400px) and (orientation: landscape) {
      #screen-menu .title { font-size: 24px; margin-bottom: 5px; }
      #screen-menu .subtitle { margin-bottom: 10px; }
      #screen-menu .high-score { margin-bottom: 10px; }
      .btn { padding: 8px 24px; font-size: 13px; min-height: 40px; }
      #screen-gameover .go-title { font-size: 22px; margin-bottom: 10px; }
      .go-stats { font-size: 13px; gap: 2px; margin-bottom: 10px; }
      .mission-progress { margin-top: 8px; }
      .countdown-text { font-size: 50px; }
    }

    /* ─── Global Mute Button (always visible) ─── */
    #btn-mute {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      right: max(16px, env(safe-area-inset-right, 16px));
      z-index: 999;
      pointer-events: auto;
      background: rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,255,0.2);
      color: #fff;
      width: clamp(44px, 8vw, 52px);
      height: clamp(44px, 8vw, 52px);
      border-radius: 50%;
      font-size: clamp(18px, 3.5vw, 24px);
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.15s;
      line-height: 1;
    }
    #btn-mute:active { transform: scale(0.9); }
    #btn-mute.muted { background: rgba(255, 50, 50, 0.4); border-color: rgba(255, 50, 50, 0.5); }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer">
      <div id="screen-loading" class="screen">
        <div class="title">SUBWAY SURF</div>
        <div class="loading-bar-container">
          <div class="loading-bar-fill" id="loading-bar"></div>
        </div>
        <div class="loading-text" id="loading-text">Loading...</div>
      </div>
      <div id="screen-menu" class="screen hidden">
        <div class="currency-bar">
          <span id="menu-coins">🪙 0</span>
          <span id="menu-keys">🔑 0</span>
        </div>
        <div class="title">SUBWAY SURF</div>
        <div class="subtitle">Endless Runner</div>
        <div class="high-score" id="menu-high-score">Best: 0</div>
        <div class="menu-buttons">
          <button class="btn btn-primary" id="btn-play">Play</button>
          <button class="btn btn-secondary" id="btn-shop">Shop</button>
          <button class="btn btn-secondary" id="btn-missions">Missions</button>
        </div>
      </div>
      <div id="screen-hud" class="screen hidden">
        <div class="hud-top">
          <div class="hud-left">
            <div class="score-display" id="hud-score">0</div>
            <div class="multiplier-display" id="hud-multiplier">x1</div>
            <div class="coin-display" id="hud-coins">🪙 0</div>
          </div>
          <div class="hud-right">
            <button class="pause-btn" id="btn-pause">⏸</button>
            <div class="powerup-timer" id="hud-powerup">
              <span id="hud-powerup-name"></span>
              <div class="powerup-timer-bar" id="hud-powerup-bar" style="width:100%"></div>
            </div>
          </div>
        </div>
        <div class="hud-bottom">
          <div class="hoverboard-indicator" id="hud-hoverboard" style="display:none">🛹 x0</div>
        </div>
      </div>
      <div id="screen-pause" class="screen hidden">
        <div class="pause-title">PAUSED</div>
        <div class="pause-buttons">
          <button class="btn btn-primary" id="btn-resume">Resume</button>
          <button class="btn btn-secondary" id="btn-pause-menu">Main Menu</button>
        </div>
      </div>
      <div id="screen-revive" class="screen hidden">
        <div class="revive-prompt">
          <div class="revive-title">Continue?</div>
          <div class="revive-timer" id="revive-timer">5</div>
          <div class="revive-cost" id="revive-cost">Cost: 500 coins</div>
          <div class="revive-buttons">
            <button class="btn btn-primary" id="btn-revive">Revive</button>
            <button class="btn btn-secondary" id="btn-no-revive">Give Up</button>
          </div>
        </div>
      </div>
      <div id="screen-gameover" class="screen hidden">
        <div class="go-title">GAME OVER</div>
        <div class="go-stats">
          <div><span class="label">Score: </span><span class="value" id="go-score">0</span></div>
          <div><span class="label">Best: </span><span class="value" id="go-best">0</span><span class="new-best" id="go-new-best" style="display:none"> NEW!</span></div>
          <div><span class="label">Coins: </span><span class="value" id="go-coins">0</span></div>
          <div><span class="label">Distance: </span><span class="value" id="go-distance">0m</span></div>
        </div>
        <div class="go-buttons">
          <button class="btn btn-secondary" id="btn-go-menu">Menu</button>
          <button class="btn btn-primary" id="btn-go-restart">Play Again</button>
        </div>
        <div class="mission-progress" id="go-missions"></div>
      </div>
      <div id="screen-shop" class="screen hidden">
        <div class="shop-header">
          <div class="shop-title">Shop</div>
          <button class="shop-close" id="btn-shop-close">✕</button>
        </div>
        <div class="currency-bar" style="position:static;margin-bottom:16px">
          <span id="shop-coins">🪙 0</span>
          <span id="shop-keys">🔑 0</span>
        </div>
        <div class="shop-grid" id="shop-grid"></div>
      </div>
      <div id="screen-missions" class="screen hidden">
        <div class="shop-header">
          <div class="missions-title">Missions</div>
          <button class="shop-close" id="btn-missions-close">✕</button>
        </div>
        <div class="missions-list" id="missions-list"></div>
      </div>
      <div class="countdown-overlay" id="countdown-overlay" style="display:none">
        <div class="countdown-text" id="countdown-text"></div>
      </div>
    </div>
    <button id="btn-mute" title="Toggle Sound">🔊</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
